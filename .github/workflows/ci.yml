name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build
      - run: yarn pack:check

  ios-bridge-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: RestJsonMapper bridge-contract fixtures
        run: yarn test:ios-bridge

  android-bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: AppleMusicJsonMapper bridge-contract fixtures (JVM, no AARs)
        run: yarn test:android-bridge
